
name: CI Banco API Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:3000
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout do projeto de testes
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências dos testes
        run: npm ci

      - name: Checkout da aplicação Banco API
        uses: actions/checkout@v4
        with:
          repository: juliodelimas/banco-api
          path: banco-api

      - name: Instalar dependências da aplicação
        working-directory: banco-api
        run: npm ci

      # Próximas etapas:
      # 1. Configurar o serviço MySQL
      # 2. Criar tabelas e massa de dados
      # 3. Iniciar a API REST em segundo plano
      # 4. Validar a disponibilidade da API

      - name: Executar testes automatizados
        run: npm test

      - name: Publicar relatório Mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-banco-api
          path: mochawesome-report/
          if-no-files-found: warn


          
