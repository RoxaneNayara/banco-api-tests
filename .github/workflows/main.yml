
name: CI Banco API Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    # Serviço MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: banco
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      BASE_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
      DB_NAME: banco
      PORT: '3000'

    steps:
      - name: Checkout do projeto de testes
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências dos testes
        run: npm ci

      - name: Checkout da aplicação Banco API
        uses: actions/checkout@v4
        with:
          repository: juliodelimas/banco-api
          path: banco-api

      - name: Instalar dependências da aplicação
        working-directory: banco-api
        run: npm ci

      - name: Instalar cliente MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Verificar conexão com MySQL
        env:
          MYSQL_PWD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
        run: |
          mysql -h 127.0.0.1 -u root \
            -e "SHOW DATABASES;"

  I
